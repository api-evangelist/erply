openapi: 3.2.0
info:
  description: 'Product information management API

    -------


    Summary


    It is built top of Erply''s current product database.'
  title: PIM Export API
  contact:
    email: david.zingerman@erply.com
  version: 1.143.20
tags:
- name: Export
paths:
  /v1/export/assortments:
    get:
      security:
      - sk: []
      - cc: []
      - jwt: []
      description: You can export all the assortments, as well as filter by the ids.
      tags:
      - Export
      summary: Get Assortments Export
      parameters:
      - description: export by assortment IDs. The parameter can contain semicolon delimited IDs.
        name: assortmentID
        in: query
        schema:
          type: integer
      - description: Supply the warehouse IDs to get the values for stock, price and warehousePrice. The parameter can contain semicolon delimited IDs. To get a list of warehouse IDs, make an Account Admin API call GET /v1/warehouse, using corresponding endpoint for your account. https://api-am-eu10.erply.com/documentation/index.html#/warehouse/get_v1_warehouse
        name: warehouseIds
        in: query
        schema:
          type: array
          items:
            type: integer
      responses:
        '200':
          description: binary xlsx file content
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
      operationId: getV1ExportAssortments
      x-operation-id-source: derived
  /v1/export/matrix-products:
    get:
      security:
      - sk: []
      - cc: []
      - jwt: []
      tags:
      - Export
      summary: Get Matrix Products Export
      parameters:
      - description: filter by the matrix product ids. The parameter can contain semicolon delimited IDs.
        name: ids
        in: query
        schema:
          type: array
          items:
            type: integer
      - description: filter by the status. By default all records except archived are returned
        name: status
        in: query
        schema:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
          - NO_LONGER_ORDERED
          - NOT_FOR_SALE
      - description: filter by the group ids. The parameter can contain semicolon delimited IDs.
        name: groupIds
        in: query
        schema:
          type: array
          items:
            type: integer
      - description: filter by the category ids. The parameter can contain semicolon delimited IDs.
        name: categoryIds
        in: query
        schema:
          type: array
          items:
            type: integer
      - description: filter by the brand ids. The parameter can contain semicolon delimited IDs.
        name: brandIds
        in: query
        schema:
          type: array
          items:
            type: integer
      - description: filter by the supplier ids. The parameter can contain semicolon delimited IDs.
        name: supplierIds
        in: query
        schema:
          type: array
          items:
            type: integer
      - description: filter by the priority group ids. The parameter can contain semicolon delimited IDs.
        name: priorityGroupIds
        in: query
        schema:
          type: array
          items:
            type: integer
      - description: filter by the family ids. The parameter can contain semicolon delimited IDs.
        name: familyIds
        in: query
        schema:
          type: array
          items:
            type: integer
      - description: Supply the warehouse IDs to get the values for stock, price and warehousePrice. The parameter can contain semicolon delimited IDs. To get a list of warehouse IDs, make an Account Admin API call GET /v1/warehouse, using corresponding endpoint for your account. https://api-am-eu10.erply.com/documentation/index.html#/warehouse/get_v1_warehouse
        name: warehouseIds
        in: query
        schema:
          type: array
          items:
            type: integer
      responses:
        '200':
          description: binary xlsx file content
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
      operationId: getV1ExportMatrixProducts
      x-operation-id-source: derived
  /v1/export/products:
    get:
      security:
      - sk: []
      - cc: []
      - jwt: []
      description: By default the endpoint exports all the products, but you can apply filtering with the parameters below
      tags:
      - Export
      summary: Get Products Export
      parameters:
      - description: export only selected product IDs. The parameter can contain semicolon delimited IDs.
        name: ids
        in: query
        schema:
          type: array
          items:
            type: integer
      - description: filter by the status. By default all records except archived are returned
        name: status
        in: query
        schema:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
          - NO_LONGER_ORDERED
          - NOT_FOR_SALE
      - description: filter by the group ids. The parameter can contain semicolon delimited IDs.
        name: groupIds
        in: query
        schema:
          type: array
          items:
            type: integer
      - description: filter by the unit ids. The parameter can contain semicolon delimited IDs.
        name: unitIds
        in: query
        schema:
          type: array
          items:
            type: integer
      - description: filter by the tax rate ids. The parameter can contain semicolon delimited IDs.
        name: taxRateIds
        in: query
        schema:
          type: array
          items:
            type: integer
      - description: filter by the category ids. The parameter can contain semicolon delimited IDs.
        name: categoryIds
        in: query
        schema:
          type: array
          items:
            type: integer
      - description: filter by the brand ids. The parameter can contain semicolon delimited IDs.
        name: brandIds
        in: query
        schema:
          type: array
          items:
            type: integer
      - description: filter by the supplier ids. The parameter can contain semicolon delimited IDs.
        name: supplierIds
        in: query
        schema:
          type: array
          items:
            type: integer
      - description: filter by the priority group ids. The parameter can contain semicolon delimited IDs.
        name: priorityGroupIds
        in: query
        schema:
          type: array
          items:
            type: integer
      - description: filter by the country ids. The parameter can contain semicolon delimited IDs.
        name: countryIds
        in: query
        schema:
          type: array
          items:
            type: integer
      - description: Supply the warehouse IDs to get the values for stock, price and warehousePrice. The parameter can contain semicolon delimited IDs. To get a list of warehouse IDs, make an Account Admin API call GET /v1/warehouse, using corresponding endpoint for your account. https://api-am-eu10.erply.com/documentation/index.html#/warehouse/get_v1_warehouse
        name: warehouseIds
        in: query
        schema:
          type: array
          items:
            type: integer
      - description: filter by the warehouse location ids. The parameter can contain semicolon delimited IDs.
        name: warehouseLocationIds
        in: query
        schema:
          type: array
          items:
            type: integer
      - description: filter by the parent product ids. The parameter can contain semicolon delimited IDs.
        name: parentProductIds
        in: query
        schema:
          type: array
          items:
            type: integer
      - description: filter by the deposit fee ids. The parameter can contain semicolon delimited IDs.
        name: depositFeeIds
        in: query
        schema:
          type: array
          items:
            type: integer
      - description: filter by the family ids. The parameter can contain semicolon delimited IDs.
        name: familyIds
        in: query
        schema:
          type: array
          items:
            type: integer
      responses:
        '200':
          description: binary xlsx file content
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
      operationId: getV1ExportProducts
      x-operation-id-source: derived
components:
  schemas:
    responses.MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: some message
  securitySchemes:
    cc:
      type: apiKey
      name: clientCode
      in: header
    jwt:
      type: apiKey
      name: jwt
      in: header
    sk:
      type: apiKey
      name: sessionKey
      in: header
