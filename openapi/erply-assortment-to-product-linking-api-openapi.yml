swagger: '2.0'
info:
  description: "\n\n## Overview\n\n\n\nThis application offers an API for managing assignments and tasks.\n\n\n\nGraphQL endpoint for the same API is [also available](/graph)\n\n\n\n<details><summary>Authentication</summary>\n\n\n\n> \n\n> Authenticate using your Erply credentials and get a sessionKey. This sessionKey and your Erply clientCode must be provided in the HTTP headers of every request. You do not have to authenticate against this API - valid Erply sessionKey-s from other sources are also acceptable. To authenticate using this API, use the `POST /api/v1/auth` endpoint.\n\n>\n\n</details>\n\n"
  title: assignments Assortment Assortment To Product Linking API
  contact: {}
  version: 2.36.5
host: ''
basePath: ''
schemes: []
tags:
- name: Assortment To Product Linking
paths:
  /v1/assortment/products/links/{productIDs}:
    delete:
      security:
      - sk: []
      - cc: []
      - jwt: []
      description: 'Delete products from all assortments providing product IDs

        responds with link IDs that were deleted'
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Assortment To Product Linking
      summary: Delete products from all assortments
      parameters:
      - type: string
        description: can contain up to 100 semicolon delimited product IDs.
        name: productIDs
        in: path
        required: true
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/responses.Response'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.MessageResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.MessageResponse'
  /v1/assortment/products/{ids}:
    delete:
      security:
      - sk: []
      - cc: []
      - jwt: []
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Assortment To Product Linking
      summary: Delete Assortment Product Links
      parameters:
      - type: string
        description: up to 100 semicolon delimited link IDs
        name: ids
        in: path
        required: true
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/responses.Response'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.MessageResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.MessageResponse'
  /v1/assortment/products/{ids}/bulk:
    delete:
      security:
      - sk: []
      - cc: []
      - jwt: []
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Assortment To Product Linking
      summary: Delete product to assortment links by link IDs
      deprecated: true
      parameters:
      - type: string
        description: can contain up to 100 semicolon delimited link IDs.
        name: ids
        in: path
        required: true
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/responses.Response'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.MessageResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.MessageResponse'
  /v1/assortment/products/{id}:
    patch:
      security:
      - sk: []
      - cc: []
      - jwt: []
      description: Status can be ACTIVE, ARCHIVED, NO_LONGER_ORDERED, NOT_FOR_SALE
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Assortment To Product Linking
      summary: Update Assortment's Products Link Data
      parameters:
      - type: integer
        description: link ID
        name: id
        in: path
        required: true
      - description: link status is mandatory, product name translations only if you want to update some language name
        name: link
        in: body
        required: true
        schema:
          $ref: '#/definitions/models.AssortmentToProductUpdateRequest'
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/responses.Response'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.MessageResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.MessageResponse'
  /v1/assortment/{id}/products:
    get:
      security:
      - sk: []
      - cc: []
      - jwt: []
      description: Get Assortment's Products Link Data only for active links.  Status can be ACTIVE, ARCHIVED, NO_LONGER_ORDERED, NOT_FOR_SALE
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Assortment To Product Linking
      summary: Get Assortment's Products Link Data
      parameters:
      - type: integer
        description: it' s a `UNIX timestamp`
        name: If-Modified-Since
        in: header
      - type: integer
        description: Assortment ID
        name: id
        in: path
        required: true
      - type: integer
        description: skip n records
        name: skip
        in: query
      - type: integer
        description: 'items to take, default: 20, max: 100000'
        name: take
        in: query
      responses:
        '200':
          description: OK
          schema:
            type: array
            items:
              $ref: '#/definitions/models.AssortmentToProductLinkResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.MessageResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.MessageResponse'
    post:
      security:
      - sk: []
      - cc: []
      - jwt: []
      description: Add Product to Assortment. Status can be ACTIVE, ARCHIVED, NO_LONGER_ORDERED, NOT_FOR_SALE
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Assortment To Product Linking
      summary: Add Product to Assortment
      parameters:
      - type: integer
        description: Assortment ID
        name: id
        in: path
        required: true
      - description: product ID, link status, product name
        name: assortmentRequest
        in: body
        required: true
        schema:
          $ref: '#/definitions/models.AssortmentToProductRequest'
      responses:
        '201':
          description: Created
          schema:
            $ref: '#/definitions/responses.Response'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.MessageResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.MessageResponse'
  /v1/assortment/{id}/products/bulk:
    post:
      security:
      - sk: []
      - cc: []
      - jwt: []
      description: Add Products to Assortment in bulk.  Status can be ACTIVE, ARCHIVED, NO_LONGER_ORDERED, NOT_FOR_SALE
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Assortment To Product Linking
      summary: Add Products to Assortment
      parameters:
      - description: bulk add request
        name: assortmentRequest
        in: body
        required: true
        schema:
          $ref: '#/definitions/models.AssortmentToProductBulkRequest'
      - type: integer
        description: Assortment ID
        name: id
        in: path
        required: true
      responses:
        '201':
          description: Created
          schema:
            $ref: '#/definitions/responses.BulkResponseWithResults'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.MessageResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.MessageResponse'
  /v1/assortment/{id}/products/data:
    get:
      security:
      - sk: []
      - cc: []
      - jwt: []
      description: 'Get Assortment''s Products Data with total count. The assortment to product link status is in the `linkStatus` field under each product''s data.

        The `linkStatus` field is filterable and sortable.  Status can be ACTIVE, ARCHIVED, NO_LONGER_ORDERED, NOT_FOR_SALE

        The `product_name_in_assortment` field is filterable.  just put [[''product_name_in_assortment.en'',''='',''bla-bla-bla''],''or'',''product_name_in_assortment.fr'',''='',''yada-yada]

        the ''and'' operand is not supported for the  `product_name_in_assortment`'
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Assortment To Product Linking
      summary: Get Assortment's Products Data
      parameters:
      - type: integer
        description: it' s a `UNIX timestamp`
        name: If-Modified-Since
        in: header
      - type: integer
        description: Assortment ID
        name: id
        in: path
        required: true
      - type: integer
        description: skip n records
        name: skip
        in: query
      - type: integer
        description: 'items to take, default: 20, max: 100000'
        name: take
        in: query
      - type: string
        description: the sort parameter is explained in the `Filtering & Sorting` section on top of the Swagger documentation
        name: sort
        in: query
      - type: string
        description: the filter parameter is explained in the `Filtering & Sorting` section on top of the Swagger documentation
        name: filter
        in: query
      - type: boolean
        description: optionally return total number of records in the X-Total-Count response header
        name: withTotalCount
        in: query
      responses:
        '200':
          description: OK
          schema:
            type: array
            items:
              $ref: '#/definitions/products.ProductsResponseWithCount'
          headers:
            X-Total-Count:
              type: uint
              description: total number of records (ignores skip & take parameters)
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.MessageResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.MessageResponse'
  /v1/assortment/{id}/products/deleted:
    get:
      security:
      - sk: []
      - cc: []
      - jwt: []
      description: Input the assortment ID and optionally a header with the unix timestamp, responds with the found product IDs in the IDs field
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Assortment To Product Linking
      summary: Get Deleted Assortment's Products IDs
      parameters:
      - type: integer
        description: it' s a `UNIX timestamp`
        name: If-Deleted-Since
        in: header
      - type: integer
        description: Assortment ID
        name: id
        in: path
        required: true
      responses:
        '200':
          description: OK
          schema:
            type: array
            items:
              $ref: '#/definitions/models.AssortmentToProductLinkResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.MessageResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.MessageResponse'
  /v1/product/{id}/assortments:
    get:
      security:
      - sk: []
      - cc: []
      - jwt: []
      description: Get Assortments for Product
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Assortment To Product Linking
      summary: Get Assortments for Product
      parameters:
      - type: integer
        description: product ID
        name: id
        in: path
        required: true
      - type: integer
        description: skip n records
        name: skip
        in: query
      - type: integer
        description: 'items to take, default: 20, max: 100000'
        name: take
        in: query
      responses:
        '200':
          description: OK
          schema:
            type: array
            items:
              $ref: '#/definitions/models.AssortmentToProductLinkResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.MessageResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.MessageResponse'
