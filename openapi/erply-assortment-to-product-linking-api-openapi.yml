      assortment_id:
        type: integer
      id:
        type: integer
      product_id:
        type: integer
      product_name_in_assortment:
        $ref: '#/definitions/Translatable'
      status:
        description: Status of the Assortment To Product link
        type: string
        example: ACTIVE
  models.AssortmentToProductRequest:
    type: object
    properties:
      product_id:
        type: integer
      product_name_in_assortment:
