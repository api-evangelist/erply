openapi: 3.2.0
info:
  description: 'Product information management API

    -------


    Summary


    It is built top of Erply''s current product database.'
  title: PIM Product Package API
  contact:
    email: david.zingerman@erply.com
  version: 1.143.20
tags:
- name: Product Package
paths:
  /v1/product/package:
    get:
      security:
      - sk: []
      - cc: []
      - jwt: []
      description: Get Package
      tags:
      - Product Package
      summary: Get Packages
      parameters:
      - description: skip n records
        name: skip
        in: query
        schema:
          type: integer
      - description: 'items to take, default: 20, max: 100000'
        name: take
        in: query
        schema:
          type: integer
      - description: the sort parameter is explained in the `Filtering & Sorting` section on top of the Swagger documentation
        name: sort
        in: query
        schema:
          type: string
      - description: the filter parameter is explained in the `Filtering & Sorting` section on top of the Swagger documentation
        name: filter
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/packages.PackageResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
      operationId: getV1ProductPackage
      x-operation-id-source: derived
    post:
      security:
      - sk: []
      - cc: []
      - jwt: []
      tags:
      - Product Package
      summary: Create Package
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.Response'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/packages.PackageRequest'
        description: package
        required: true
      operationId: postV1ProductPackage
      x-operation-id-source: derived
  /v1/product/package/category:
    get:
      security:
      - sk: []
      - cc: []
      - jwt: []
      description: Get Product
      tags:
      - Product Package
      summary: Get Package Categories
      parameters:
      - description: skip n records
        name: skip
        in: query
        schema:
          type: integer
      - description: 'items to take, default: 20, max: 100000'
        name: take
        in: query
        schema:
          type: integer
      - description: the sort parameter is explained in the `Filtering & Sorting` section on top of the Swagger documentation
        name: sort
        in: query
        schema:
          type: string
      - description: the filter parameter is explained in the `Filtering & Sorting` section on top of the Swagger documentation
        name: filter
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/packages.PackageCategoryResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
      operationId: getV1ProductPackageCategory
      x-operation-id-source: derived
  /v1/product/package/{ids}:
    delete:
      security:
      - sk: []
      - cc: []
      - jwt: []
      tags:
      - Product Package
      summary: Delete Packages
      parameters:
      - description: up to 100 semicolon delimited package IDs
        name: ids
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.Response'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
      operationId: deleteV1ProductPackageByIds
      x-operation-id-source: derived
  /v1/product/package/{id}:
    put:
      security:
      - sk: []
      - cc: []
      - jwt: []
      tags:
      - Product Package
      summary: Update Package
      parameters:
      - description: package ID
        name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.Response'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/packages.PackageUpdateRequest'
        description: package
        required: true
      operationId: putV1ProductPackageById
      x-operation-id-source: derived
components:
  schemas:
    packages.PackageUpdateRequest:
      type: object
      properties:
        code:
          description: To be used if the package has a different code than the product itself.
          type: string
        gross_weight:
          description: GrossWeight is Item's gross weight (with packaging). Unit depends on region, check your Erply account (typically lbs or kg).
          type: number
        height:
          type: number
        length:
          description: Length is Item's physical dimensions.
          type: number
        net_weight:
          type: string
        package_category_id:
          description: Package Category ID
          type: integer
        units:
          description: Size of the package (how many pcs it contains)
          type: number
        width:
          type: number
    Translatable:
      type: object
      properties:
        en:
          description: This field supports more languages. Please read Translatable names and descriptions block in the documentation.
          type: string
    responses.MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: some message
    packages.PackageCategoryResponse:
      type: object
      properties:
        added:
          description: Unix timestamp
          type: integer
          example: 1595230999
        addedby:
          description: username
          type: string
          example: k@erp.xyz
        changed:
          description: Unix timestamp
          type: integer
          example: 1595230999
        changedby:
          description: username
          type: string
          example: k@erp.xyz
        id:
          description: object ID
          type: integer
          example: 1234
        name:
          description: /This field supports more languages. Please read Translatable names and descriptions block in the documentation.
          $ref: '#/components/schemas/Translatable'
        order:
          type: integer
          example: 15
    responses.Response:
      type: object
      properties:
        id:
          type: integer
          example: 73
    packages.PackageResponse:
      type: object
      properties:
        added:
          description: Unix timestamp
          type: integer
          example: 1595230999
        addedby:
          description: username
          type: string
          example: k@erp.xyz
        changed:
          description: Unix timestamp
          type: integer
          example: 1595230999
        changedby:
          description: username
          type: string
          example: k@erp.xyz
        code:
          description: To be used if the package has a different code than the product itself.
          type: string
        gross_weight:
          description: GrossWeight is Item's gross weight (with packaging). Unit depends on region, check your Erply account (typically lbs or kg).
          type: number
        height:
          type: number
        id:
          description: object ID
          type: integer
          example: 1234
        length:
          description: Length is Item's physical dimensions.
          type: number
        net_weight:
          type: string
        package_category_id:
          description: Package Category ID
          type: integer
        product_id:
          type: integer
        units:
          description: Size of the package (how many pcs it contains)
          type: number
        width:
          type: number
    packages.PackageRequest:
      type: object
      properties:
        code:
          description: To be used if the package has a different code than the product itself.
          type: string
        gross_weight:
          description: GrossWeight is Item's gross weight (with packaging). Unit depends on region, check your Erply account (typically lbs or kg).
          type: number
        height:
          type: number
        length:
          description: Length is Item's physical dimensions.
          type: number
        net_weight:
          type: string
        package_category_id:
          description: Package Category ID
          type: integer
        product_id:
          type: integer
        units:
          description: Size of the package (how many pcs it contains)
          type: number
        width:
          type: number
  securitySchemes:
    cc:
      type: apiKey
      name: clientCode
      in: header
    jwt:
      type: apiKey
      name: jwt
      in: header
    sk:
      type: apiKey
      name: sessionKey
      in: header
