openapi: 3.2.0
info:
  description: '## Overview


    This application offers an API for managing assignments and tasks.'
  title: assignments Clsf Events API
  contact: {}
  version: 2.36.5
tags:
- name: clsf-events
paths:
  /api/v1/clsf/event-type:
    get:
      security:
      - ErplyClientCode: []
      - ErplySession: []
      - ErplyJWT: []
      tags:
      - clsf-events
      summary: Look up event types
      parameters:
      - description: Event type ids
        name: ids
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - description: Object type for which event types should be returned. One of [workorder raji]
        name: entity
        in: query
        required: true
        schema:
          type: string
      - description: Language to use when sorting by name (`en`, `et`, `ru` etc.)
        name: lang
        in: query
        schema:
          type: string
      - description: Event type code to search for. Partial matching from the beginning of the code
        name: code
        in: query
        schema:
          type: string
      - description: Result page size
        name: pageSize
        in: query
        schema:
          type: integer
      - description: Result page number
        name: pageNr
        in: query
        schema:
          type: integer
      - description: 'Sorting order. Supported values are: `id`, `name`. Defaults to `id`'
        name: sort
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClsfResponse'
        '401':
          description: Forbidden
        '500':
          description: Internal Server Error
      operationId: getApiV1ClsfEventType
      x-operation-id-source: derived
    post:
      security:
      - ErplyClientCode: []
      - ErplySession: []
      - ErplyJWT: []
      tags:
      - clsf-events
      summary: Add a new event type
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClsfResponse'
        '400':
          description: Bad Request
        '401':
          description: Forbidden
        '500':
          description: Internal Server Error
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClsfEventTypeRequest'
        description: Clsf record
        required: true
      operationId: postApiV1ClsfEventType
      x-operation-id-source: derived
  /api/v1/clsf/event-type/{typeId}:
    delete:
      security:
      - ErplyClientCode: []
      - ErplySession: []
      - ErplyJWT: []
      tags:
      - clsf-events
      summary: Delete one event type record
      parameters:
      - description: Record id
        name: typeId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      operationId: deleteApiV1ClsfEventTypeByTypeId
      x-operation-id-source: derived
    patch:
      security:
      - ErplyClientCode: []
      - ErplySession: []
      - ErplyJWT: []
      tags:
      - clsf-events
      summary: Update an existing event type record
      parameters:
      - description: Record id
        name: typeId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClsfResponse'
        '400':
          description: Bad Request
        '401':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClsfEventTypeRequest'
        description: Clsf record
        required: true
      operationId: patchApiV1ClsfEventTypeByTypeId
      x-operation-id-source: derived
