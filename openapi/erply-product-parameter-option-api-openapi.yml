swagger: '2.0'
info:
  description: "\n\n## Overview\n\n\n\nThis application offers an API for managing assignments and tasks.\n\n\n\nGraphQL endpoint for the same API is [also available](/graph)\n\n\n\n<details><summary>Authentication</summary>\n\n\n\n> \n\n> Authenticate using your Erply credentials and get a sessionKey. This sessionKey and your Erply clientCode must be provided in the HTTP headers of every request. You do not have to authenticate against this API - valid Erply sessionKey-s from other sources are also acceptable. To authenticate using this API, use the `POST /api/v1/auth` endpoint.\n\n>\n\n</details>\n\n"
  title: assignments Assortment Product Parameter Option API
  contact: {}
  version: 2.36.5
host: ''
basePath: ''
schemes: []
tags:
- name: Product Parameter Option
paths:
  /v1/product/parameter/option:
    post:
      security:
      - sk: []
      - cc: []
      - jwt: []
      description: Create Product Parameter Option
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Product Parameter Option
      summary: Create Product Parameter Option
      parameters:
      - description: Parameter Option
        name: parameter_option
        in: body
        required: true
        schema:
          $ref: '#/definitions/requests.ParameterOptionRequest'
      responses:
        '201':
          description: Created
          schema:
            $ref: '#/definitions/responses.Response'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.MessageResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.MessageResponse'
  /v1/product/parameter/option/{ids}:
    delete:
      security:
      - sk: []
      - cc: []
      - jwt: []
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Product Parameter Option
      summary: Delete Product Parameter Options
      parameters:
      - type: string
        description: up to 100 semicolon delimited parameter Option IDs
        name: ids
        in: path
        required: true
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/responses.Response'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.MessageResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.MessageResponse'
  /v1/product/parameter/option/{id}:
    put:
      security:
      - sk: []
      - cc: []
      - jwt: []
      description: Update Product Parameter Option
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Product Parameter Option
      summary: Update Product Parameter Option
      parameters:
      - description: Parameter Option Name
        name: name
        in: body
        required: true
        schema:
          $ref: '#/definitions/requests.Request'
      - type: integer
        description: parameterOption ID
        name: id
        in: path
        required: true
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/responses.Response'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.MessageResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.MessageResponse'
  /v1/product/parameter/option/{id}/products:
    get:
      security:
      - sk: []
      - cc: []
      - jwt: []
      description: Get Parameter Option and Products associated with a parameter that has the Parameter Options
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Product Parameter Option
      summary: Get Parameter Option and Products associated with a parameter that has a Parameter Options
      parameters:
      - type: integer
        description: option ID
        name: id
        in: path
        required: true
      - type: integer
        description: skip n records
        name: skip
        in: query
      - type: integer
        description: 'items to take, default: 20, max: 100000'
        name: take
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/models.ParameterOptionWithProductsResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.MessageResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.MessageResponse'
  /v1/product/parameter/option/{parameterId}:
    get:
      security:
      - sk: []
      - cc: []
      - jwt: []
      description: Get Product Parameter Option
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Product Parameter Option
      summary: Get Product Parameter Options
      parameters:
      - type: integer
        description: parameter ID
        name: parameterId
        in: path
        required: true
      - type: integer
        description: skip n records
        name: skip
        in: query
      - type: integer
        description: 'items to take, default: 20, max: 100000'
        name: take
        in: query
      responses:
        '200':
          description: OK
          schema:
            type: array
            items:
              $ref: '#/definitions/parametermodels.OptionResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.MessageResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.MessageResponse'
