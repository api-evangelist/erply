swagger: '2.0'
info:
  description: "\n\n## Overview\n\n\n\nThis application offers an API for managing assignments and tasks.\n\n\n\nGraphQL endpoint for the same API is [also available](/graph)\n\n\n\n<details><summary>Authentication</summary>\n\n\n\n> \n\n> Authenticate using your Erply credentials and get a sessionKey. This sessionKey and your Erply clientCode must be provided in the HTTP headers of every request. You do not have to authenticate against this API - valid Erply sessionKey-s from other sources are also acceptable. To authenticate using this API, use the `POST /api/v1/auth` endpoint.\n\n>\n\n</details>\n\n"
  title: assignments Assortment clsf API
  contact: {}
  version: 2.36.5
host: ''
basePath: ''
schemes: []
tags:
- name: clsf
paths:
  /api/v1/clsf/priority:
    get:
      security:
      - ErplyClientCode: []
      - ErplySession: []
      - ErplyJWT: []
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - clsf
      summary: Look up priorities
      parameters:
      - type: array
        items:
          type: integer
        collectionFormat: csv
        description: Priority ids
        name: ids
        in: query
      - type: string
        description: Entity for which priority should be returned (`raji`)
        name: entity
        in: query
        required: true
      - type: string
        description: Language to use when sorting by name (`en`, `et`, `ru` etc.)
        name: lang
        in: query
      - type: string
        description: Priority code to search for. Partial matching from the beginning of the code
        name: code
        in: query
      - type: integer
        description: Result page size
        name: pageSize
        in: query
      - type: integer
        description: Result page number
        name: pageNr
        in: query
      - type: string
        description: 'Sorting order. Supported values are: `id`, `name`. Defaults to `id`'
        name: sort
        in: query
      responses:
        '200':
          description: OK
          schema:
            type: array
            items:
              $ref: '#/definitions/ClsfResponse'
        '401':
          description: Forbidden
        '500':
          description: Internal Server Error
    post:
      security:
      - ErplyClientCode: []
      - ErplySession: []
      - ErplyJWT: []
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - clsf
      summary: Add a new priority
      parameters:
