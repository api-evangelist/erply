openapi: 3.2.0
info:
  description: 'Product information management API

    -------


    Summary


    It is built top of Erply''s current product database.'
  title: PIM Product Parameter Value API
  contact:
    email: david.zingerman@erply.com
  version: 1.143.20
tags:
- name: Product Parameter Value
paths:
  /v1/product/parameter/value/{ids}:
    delete:
      security:
      - sk: []
      - cc: []
      - jwt: []
      tags:
      - Product Parameter Value
      summary: Delete product parameter values
      parameters:
      - description: up to 100 semicolon delimited value IDs
        name: ids
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.Response'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
      operationId: deleteV1ProductParameterValueByIds
      x-operation-id-source: derived
  /v1/product/parameter/value/{id}:
    put:
      security:
      - sk: []
      - cc: []
      - jwt: []
      tags:
      - Product Parameter Value
      summary: Update Product Parameter Value
      parameters:
      - description: value ID
        name: id
        in: path
        required: true
        schema:
          type: integer
      - description: Apply-Validation-Rules flag
        name: Apply-Validation-Rules
        in: header
        required: true
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.Response'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requests.ValueRequest'
        description: Parameter Value
        required: true
      operationId: putV1ProductParameterValueById
      x-operation-id-source: derived
  /v1/product/{ids}/parameter/value:
    get:
      security:
      - sk: []
      - cc: []
      - jwt: []
      description: Get Product Parameter Values by Product IDs (ids parameter)
      tags:
      - Product Parameter Value
      summary: Get Product Parameter Values by Product IDs
      parameters:
      - description: can contain semicolon delimited IDs.
        name: ids
        in: path
        required: true
        schema:
          type: string
      - description: skip n records
        name: skip
        in: query
        schema:
          type: integer
      - description: 'items to take, default: 20, max: 100000'
        name: take
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/parametermodels.ValueResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
      operationId: getV1ProductByIdsParameterValue
      x-operation-id-source: derived
  /v1/product/{productId}/parameter/{parameterId}/value:
    post:
      security:
      - sk: []
      - cc: []
      - jwt: []
      description: 'Type `TEXT`: "value":"your_text"

        Type `BOOLEAN` : "value":true

        Type `INTEGER`: "value":1

        Type `DECIMAL`: "value": 1.01

        Type `LIST`: "value": 1 (1 is option ID)

        Type `MULTILIST`: "value": [1,2,3] (arrray of option IDs)'
      tags:
      - Product Parameter Value
      summary: Assign Value to Product's Parameter
      parameters:
      - description: product ID
        name: productId
        in: path
        required: true
        schema:
          type: integer
      - description: parameter ID
        name: parameterId
        in: path
        required: true
        schema:
          type: integer
      - description: Apply-Validation-Rules flag
        name: Apply-Validation-Rules
        in: header
        required: true
        schema:
          type: boolean
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.Response'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requests.ValueRequest'
        description: Value
        required: true
      operationId: postV1ProductByProductIdParameterByParameterIdValue
      x-operation-id-source: derived
components:
  schemas:
    responses.MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: some message
    responses.Response:
      type: object
      properties:
        id:
          type: integer
          example: 73
    parametermodels.ValueResponse:
      type: object
      properties:
        added:
          description: Unix timestamp
          type: integer
          example: 1595230999
        addedby_id:
          description: user ID
          type: integer
          example: 1
        changed:
          description: Unix timestamp
          type: integer
          example: 1595230999
        changedby_id:
          description: user ID
          type: integer
          example: 1
        id:
          type: integer
        parameter_id:
          type: integer
        product_id:
          type: integer
        value:
          description: can be any type. Can be parameter option also
    requests.ValueRequest:
      type: object
      properties:
        value: {}
  securitySchemes:
    cc:
      type: apiKey
      name: clientCode
      in: header
    jwt:
      type: apiKey
      name: jwt
      in: header
    sk:
      type: apiKey
      name: sessionKey
      in: header
