          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.Response'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/groupmodels.GroupRequest'
        description: productGroupRequest
        required: true
      operationId: putV1ProductGroupById
      x-operation-id-source: derived
  /v1/product/group/{id}/location-tax:
    patch:
      security:
      - sk: []
      - cc: []
      - jwt: []
      description: Add Location Specific Tax To Product Group
      tags:
      - Product Group
      summary: Add Location Specific Tax
      parameters:
      - description: group ID
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.Response'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/groupmodels.LocationSpecificTaxRequest'
        description: productGroupRequest
        required: true
      operationId: patchV1ProductGroupByIdLocationTax
      x-operation-id-source: derived
  /v1/product/group/{id}/move:
    put:
      security:
      - sk: []
      - cc: []
      - jwt: []
      description: 'position has to be one of the following: `lastChild` | `before` | `after`'
      tags:
      - Product Group
      summary: Move Product Group
      parameters:
      - description: Group ID
        name: id
        in: path
        required: true
