        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
      operationId: deleteV1ProductGroupByIds
      x-operation-id-source: derived
  /v1/product/group/{id}:
    put:
      security:
      - sk: []
      - cc: []
      - jwt: []
      tags:
      - Product Group
      summary: Update Product Group
      parameters:
      - description: Group ID
        name: id
        in: path
        required: true
