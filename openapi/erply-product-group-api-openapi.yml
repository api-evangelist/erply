openapi: 3.2.0
info:
  description: 'Product information management API

    -------


    Summary


    It is built top of Erply''s current product database.'
  title: PIM Product Group API
  contact:
    email: david.zingerman@erply.com
  version: 1.143.20
tags:
- name: Product Group
paths:
  /v1/product/group:
    get:
      security:
      - sk: []
      - cc: []
      - jwt: []
      description: Get Product Groups. The fields `quick_books_debit_account`, `quick_books_credit_account`, `reward_points` and `location_tax_rates` will be on the object only if there are values for them
      tags:
      - Product Group
      summary: Get Groups
      parameters:
      - description: skip n records
        name: skip
        in: query
        schema:
          type: integer
      - description: 'items to take, default: 20, max: 100000'
        name: take
        in: query
        schema:
          type: integer
      - description: the sort parameter is explained in the `Filtering & Sorting` section on top of the Swagger documentation
        name: sort
        in: query
        schema:
          type: string
      - description: the filter parameter is explained in the `Filtering & Sorting` section on top of the Swagger documentation
        name: filter
        in: query
        schema:
          type: string
      - description: optionally return total number of records in the X-Total-Count response header
        name: withTotalCount
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          headers:
            X-Total-Count:
              description: total number of records (ignores skip & take parameters)
              schema:
                type: uint
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/groupmodels.GroupResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
      operationId: getV1ProductGroup
      x-operation-id-source: derived
    post:
      security:
      - sk: []
      - cc: []
      - jwt: []
      tags:
      - Product Group
      summary: Create Product Group
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.Response'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/groupmodels.GroupRequest'
        description: productGroupRequest
        required: true
      operationId: postV1ProductGroup
      x-operation-id-source: derived
  /v1/product/group/bulk:
    post:
      security:
      - sk: []
      - cc: []
      - jwt: []
      description: each request contains the created resource data
      tags:
      - Product Group
      summary: Create groups in bulk
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.BulkResponseWithResults'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/groupmodels.BulkCreateGroupsRequest'
        description: bulk create request
        required: true
      operationId: postV1ProductGroupBulk
      x-operation-id-source: derived
  /v1/product/group/bulk/get:
    post:
      security:
      - sk: []
      - cc: []
      - jwt: []
      tags:
      - Product Group
      summary: Get groups in bulk
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/groupmodels.BulkReadGroupsResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/parammodels.BulkReadRequest'
        description: requests have the parameters that the original get request has, but in json format. This way you can apply the parameters to each request separately.
        required: true
      operationId: postV1ProductGroupBulkGet
      x-operation-id-source: derived
  /v1/product/group/external-ids:
    get:
      security:
      - sk: []
      - cc: []
      - jwt: []
      description: External IDs are the ones from different commerce systems. This endpoint enables the API user to read the external IDs of the Erply product groups.
      tags:
      - Product Group
      summary: Read external group IDs of Product Groups
      parameters:
      - description: up to 100 external IDs. Cannot be provided with the product group ID parameter
        name: externalIDs
        in: query
        schema:
          type: array
          items:
            type: string
      - description: up to 100 product group IDs. Cannot be provided with the external ID parameter
        name: groupIDs
        in: query
        schema:
          type: array
          items:
            type: string
      - description: integration name
        name: integrationName
        in: query
        schema:
          type: string
      - description: skip n records
        name: skip
        in: query
        schema:
          type: integer
      - description: 'items to take, default: 20, max: 100000'
        name: take
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/groupmodels.ExternalIDResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
      operationId: getV1ProductGroupExternalIds
      x-operation-id-source: derived
  /v1/product/group/external-ids/{groupIds}:
    delete:
      security:
      - sk: []
      - cc: []
      - jwt: []
      description: Requesting the endpoint will delete all the external IDs of selected product groups. With the integrationName parameter you can delete only integration-specific external IDs.
      tags:
      - Product Group
      summary: Delete external group IDs of Product Groups
      parameters:
      - description: Specify the integration name to delete the external ID associated with the integration only.
        name: integrationName
        in: query
        schema:
          type: string
      - description: up to 100 semicolon delimited Group IDs
        name: groupIds
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.Response'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
      operationId: deleteV1ProductGroupExternalIdsByGroupIds
      x-operation-id-source: derived
  /v1/product/group/external-ids/{groupId}:
    post:
      security:
      - sk: []
      - cc: []
      - jwt: []
      description: External IDs are the ones from different commerce systems. This endpoint enables the API user to attach the external IDs to the Erply product groups.
      tags:
      - Product Group
      summary: Attach external group ID to a Product Group
      parameters:
      - description: Group ID
        name: groupId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.Response'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/groupmodels.ExternalIDRequest'
        description: external ID with the integration name
        required: true
      operationId: postV1ProductGroupExternalIdsByGroupId
      x-operation-id-source: derived
    patch:
      security:
      - sk: []
      - cc: []
      - jwt: []
      description: 'External IDs are the ones from different commerce systems that have to be stored in ERPLY

        This call allows to update the external ID using the integration name and group ID.'
      tags:
      - Product Group
      summary: Update external group ID of a Product Group
      parameters:
      - description: Group ID
        name: groupId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.Response'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/groupmodels.ExternalIDRequest'
        description: external ID with the integration name
        required: true
      operationId: patchV1ProductGroupExternalIdsByGroupId
      x-operation-id-source: derived
  /v1/product/group/indented:
    get:
      security:
      - sk: []
      - cc: []
      - jwt: []
      description: The result is a indented list of group ids and names sorted by orders and prefixed by the dash (―) sign if is a parent
      tags:
      - Product Group
      summary: Get Indented List of Groups
      parameters:
      - description: Language code (ISO 639). Return the name in the requested language or leave empty for account default language.
        name: lang
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/indentation.Result'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
      operationId: getV1ProductGroupIndented
      x-operation-id-source: derived
  /v1/product/group/tree:
    get:
      security:
      - sk: []
      - cc: []
      - jwt: []
      description: 'Optionally you can get products that belong to each group

        You must specify the fields to you want to get from the groups and products (models can be found under GET /product/group and GET /product)'
      tags:
      - Product Group
      summary: Get Tree of product groups
      parameters:
      - description: You must specify the fields to you want to get from the groups and products (models can be found under GET /product/group and GET /product)
        name: groupFields
        in: query
        schema:
          type: array
          items:
            type: string
      - description: You must specify the fields to you want to get from the groups and products (models can be found under GET /product/group and GET /product)
        name: productFields
        in: query
        schema:
          type: array
          items:
            type: string
      - description: Optionally you can get products that belong to each group
        name: withProducts
        in: query
        schema:
          type: boolean
      - description: Optionally specify the language ISO 639-1 code for the translatable fields. Default is the default language of the account.
        name: languageCode
        in: query
        schema:
          type: string
      - description: skip n records
        name: skip
        in: query
        schema:
          type: integer
      - description: 'items to take, default: 20, max: 100000'
        name: take
        in: query
        schema:
          type: integer
      - description: optionally return total number of records in the X-Total-Count response header
        name: withTotalCount
        in: query
        schema:
          type: boolean
      - description: the sort parameter is explained in the `Filtering & Sorting` section on top of the Swagger documentation
        name: sort
        in: query
        schema:
          type: string
      - description: the filter parameter is explained in the `Filtering & Sorting` section on top of the Swagger documentation
        name: itemFilters
        in: query
        schema:
          type: string
      - description: the filter parameter is explained in the `Filtering & Sorting` section on top of the Swagger documentation
        name: productFilters
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/indentation.GroupTreeResultSample'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
      operationId: getV1ProductGroupTree
      x-operation-id-source: derived
  /v1/product/group/{groupId}/location-tax/{warehouseId}:
    delete:
      security:
      - sk: []
      - cc: []
      - jwt: []
      description: Delete Location Specific Tax To Product Group
      tags:
      - Product Group
      summary: Delete Location Specific Tax From Product Group
      parameters:
      - description: group ID
        name: groupId
        in: path
        required: true
        schema:
          type: string
      - description: warehouse ID
        name: warehouseId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.Response'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
      operationId: deleteV1ProductGroupByGroupIdLocationTaxByWarehouseId
      x-operation-id-source: derived
  /v1/product/group/{ids}:
    delete:
      security:
      - sk: []
      - cc: []
      - jwt: []
      tags:
      - Product Group
      summary: Delete Product Groups
      parameters:
      - description: up to 100 semicolon delimited Group IDs
        name: ids
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.Response'
        '400':
          description: Bad Request
          content:
            application/json:
