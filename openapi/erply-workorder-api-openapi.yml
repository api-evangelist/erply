components:
  schemas:
    LabelResponse:
      type: object
      properties:
        createdAt:
          type: string
        createdById:
          type: integer
        label:
          type: string
        labelType:
          type: string
        taskId:
          type: integer
        workorderId:
          type: integer
    BackupResponse:
      type: object
      properties:
        backupId:
          type: integer
          example: 1
        createdAt:
          type: string
          example: '2022-01-01T00:00:00Z'
        createdById:
          type: integer
          example: 1
        docNo:
          description: Number of the sales document for which this backup was created
          type: string
          example: '123'
        eventName:
          $ref: '#/components/schemas/core.Translatable'
        eventType:
          type: string
          example: doc_quote_created
        workorderId:
          type: integer
          example: 1
        workorderNo:
          type: string
          example: '1'
    WorkorderRequest:
      type: object
      properties:
        contactId:
          type: integer
        customerId:
          type: integer
        data:
          type: object
        deviceId:
          type: integer
        deviceUse:
          description: Stored in device_log table
          type: integer
        entity:
          type: string
        id:
          type: integer
        parentId:
          type: integer
        priority:
          type: string
        receivedAt:
          type: string
        receivedById:
          description: Set by user
          type: integer
        referenceNo:
          type: string
        returnedAt:
          type: string
        returnedById:
          description: Set by user
          type: integer
        salepointId:
          type: integer
        state:
          type: string
        taxExempt:
          type: boolean
        title:
          type: string
        type:
          type: string
        warehouseId:
          type: integer
        workorderGroupId:
          type: integer
    model.WorkorderPrepayRequest:
      type: object
      properties:
        payment:
          type: array
          items:
            $ref: '#/components/schemas/WorkorderDocRequestPayment'
        rounding:
          description: Specify rounding amount (eg. 0.02 or -0.04). Rounding is applied to invoice total with tax, after all other calculations.
          type: number
        salepointId:
          type: integer
    model.WorkorderSettleRequest:
      type: object
      properties:
        docType:
          type: string
        payment:
          type: array
          items:
            $ref: '#/components/schemas/WorkorderDocRequestPayment'
        rounding:
