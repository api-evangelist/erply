openapi: 3.2.0
info:
  description: '## Overview


    This application offers an API for managing assignments and tasks.'
  title: assignments Workorder API
  contact: {}
  version: 2.36.5
tags:
- name: workorder
paths:
  /api/v1/workorder:
    get:
      security:
      - ErplyClientCode: []
      - ErplySession: []
      - ErplyJWT: []
      - AccessToken: []
      tags:
      - workorder
      summary: Look up workorder records
      parameters:
      - description: Record ID-s
        name: id
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - description: Search by record number, document number, title, customer name, email, device serial, registration, make and model
        name: searchPhrase
        in: query
        schema:
          type: string
      - description: Workorder/Record number
        name: workorderNo
        in: query
        schema:
          type: string
      - description: Document number
        name: documentNo
        in: query
        schema:
          type: integer
      - description: Reference numbers
        name: referenceNos
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: If templates or regular workorders should be returned. By default returns both
        name: isTemplate
        in: query
        schema:
          type: boolean
      - description: Record root entity (workorder, raji)
        name: entity
        in: query
        schema:
          type: string
      - description: Record types to return. If undefined, defaults to 'workorder'
        name: types
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Record title. Uses case insensitive partial matching
        name: title
        in: query
        schema:
          type: string
      - description: Record Group ID-s that must match
        name: groupIds
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - description: Group ID field should be filled or empty
        name: groupIdNil
        in: query
        schema:
          type: boolean
      - description: Record Parent ID-s that must match
        name: parentIds
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - description: Parent ID field should be filled or empty
        name: parentIdNil
        in: query
        schema:
          type: boolean
      - description: Record ID-s for which child objects must be retrieved recursively
        name: childrenOfIds
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - description: Record ID-s for which parent objects must be retrieved recursively
        name: parentsOfIds
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - description: Record priorities that must match
        name: priorities
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Warehouse ids
        name: warehouseId
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - description: Customer ids
        name: customerId
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - description: Contact ids
        name: contactId
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - description: Device ids
        name: deviceId
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - description: Record state codes (draft, confirmed, checked_in, checked_out, in_progress, blocked, done, cancelled)
        name: state
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Record transactional state codes (preparation, estimated, prepaid, invoiced, paid)
        name: tranState
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Record task scheduled state codes (some_scheduled, nothing_scheduled)
        name: taskSchedState
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: Record row product stock state codes (parts_available, parts_not_ordered, need_po_finalization, awaiting_parts)
        name: productStockState
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: ID-s of employees who created the record
        name: createdById
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - description: Search for workorders created after the specified time (yyyy-mm-ddThh:mm:ssZ or UNIX timestamp)
        name: createdAtStart
        in: query
        schema:
          type: string
      - description: "\tSearch for workorders created before the specified time (yyyy-mm-ddThh:mm:ssZ or UNIX timestamp)"
        name: createdAtEnd
        in: query
        schema:
          type: string
      - description: ID-s of employees who updated the record
        name: updatedById
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - description: ID-s of employees who marked the linked device as received
        name: receivedById
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - description: Device received time range lower bound (yyyy-mm-ddThh:mm:ssZ or UNIX timestamp)
        name: receivedAtStart
        in: query
        schema:
          type: string
      - description: Device received time range upper bound (yyyy-mm-ddThh:mm:ssZ or UNIX timestamp)
        name: receivedAtEnd
        in: query
        schema:
          type: string
      - description: Received or not received records
        name: isReceived
        in: query
        schema:
          type: boolean
      - description: ID-s of employees who marked the linked device as returned
        name: returnedById
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - description: Device returned time range lower bound (yyyy-mm-ddThh:mm:ssZ or UNIX timestamp)
        name: returnedAtStart
        in: query
        schema:
          type: string
      - description: Device returned time range upper bound (yyyy-mm-ddThh:mm:ssZ or UNIX timestamp)
        name: returnedAtEnd
        in: query
        schema:
          type: string
      - description: Returned or not returned records
        name: isReturned
        in: query
        schema:
          type: boolean
      - description: Confirmed or not confirmed records
        name: isConfirmed
        in: query
        schema:
          type: boolean
      - description: Cancelled or not cancelled records
        name: isCancelled
        in: query
        schema:
          type: boolean
      - description: Search for workorders with linked prepayment sales documents
        name: hasDocPrepay
        in: query
        schema:
          type: boolean
      - description: Search for workorders with linked offer sales documents
        name: hasDocOffer
        in: query
        schema:
          type: boolean
      - description: Search for workorders with linked invoice sales documents
        name: hasDocInvoice
        in: query
        schema:
          type: boolean
      - description: Search for workorders with linked credit documents
        name: hasDocCredit
        in: query
        schema:
          type: boolean
      - description: Search for workorders which have been paid in full
        name: isFullyPaid
        in: query
        schema:
          type: boolean
      - description: Label type
        name: labelType
        in: query
        schema:
          type: string
      - description: Labels under the specified labelType that must match
        name: label
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - description: If total matching record count should be return in response header
        name: withTotalCount
        in: query
        schema:
          type: boolean
      - description: Result page size
        name: pageSize
        in: query
        schema:
          type: integer
      - description: Result page number
        name: pageNr
        in: query
        schema:
          type: integer
      - description: 'Sorting order. Supported values are: `id`, `workorderNo`, `referenceNo`, `netTotal`, `vatTotal`, `total`, `receivedAt`, `returnedAt`, `createdAt`, `updatedAt`, `registration`, `serial`, `brand`, `model`, `custFirstname`, `custName`, `stateCode`, `tranStateCode`, `priority`, `receiver`, `creator`, `type`'
        name: sort
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkorderResponse'
        '401':
          description: Forbidden
        '500':
          description: Internal Server Error
      operationId: getApiV1Workorder
      x-operation-id-source: derived
    post:
      security:
      - ErplyClientCode: []
      - ErplySession: []
      - ErplyJWT: []
      - AccessToken: []
      tags:
      - workorder
      summary: Add a new workorder record
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkorderResponse'
        '400':
          description: Bad Request
        '401':
          description: Forbidden
        '500':
          description: Internal Server Error
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkorderRequest'
        description: Workorder record
        required: true
      operationId: postApiV1Workorder
      x-operation-id-source: derived
  /api/v1/workorder/{workorderId}:
    delete:
