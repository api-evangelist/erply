        in: path
        required: true
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
    patch:
      security:
      - ErplyClientCode: []
      - ErplySession: []
      - ErplyJWT: []
      - AccessToken: []
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - workorder
      summary: Update workorder record
      parameters:
      - type: integer
        description: Record id
        name: workorderId
        in: path
        required: true
      - description: Workorder record
        name: record
        in: body
        required: true
        schema:
          $ref: '#/definitions/WorkorderRequest'
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/WorkorderResponse'
        '400':
          description: Bad Request
        '401':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /api/v1/workorder/{workorderId}/backup:
    get:
      security:
      - ErplyClientCode: []
      - ErplySession: []
      - ErplyJWT: []
      - AccessToken: []
      description: Look up workorder backups
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - workorder
      summary: Look up workorder backups
      parameters:
      - type: integer
        description: Workorder id
        name: workorderId
        in: path
        required: true
      - type: array
        items:
          type: string
        collectionFormat: csv
        description: Search by associated sales document numbers
        name: docNo
        in: query
      - type: boolean
        description: If total matching record count should be return in response header
        name: withTotalCount
        in: query
      - type: integer
        description: Result page size
        name: pageSize
        in: query
      - type: integer
        description: Result page number
        name: pageNr
        in: query
      - type: string
        description: Sorting order. Supported values [backupId workorderId workorderNo createdAt]
        name: sort
        in: query
      responses:
        '200':
          description: OK
          schema:
            type: array
            items:
              $ref: '#/definitions/BackupResponse'
        '401':
          description: Forbidden
        '500':
          description: Internal Server Error
  /api/v1/workorder/{workorderId}/cancel:
    post:
      security:
