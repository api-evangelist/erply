openapi: 3.2.0
info:
  description: 'Product information management API

    -------


    Summary


    It is built top of Erply''s current product database.'
  title: PIM Special Endpoints API
  contact:
    email: david.zingerman@erply.com
  version: 1.143.20
tags:
- name: Special Endpoints
paths:
  /v1/offline-db/sync/pricelist-prices:
    get:
      security:
      - sk: []
      - cc: []
      - jwt: []
      description: Get products that have been added or modified since the specified timestamp. Fetches only the columns that are actually needed for ODB (Offline Database).
      tags:
      - Special Endpoints
      summary: Get Pricelist Prices for Offline DB to sync
      parameters:
      - description: Last modification time (create/update)
        name: lastModified
        in: query
        required: true
        schema:
          type: integer
      - description: price list ID
        name: pricelistID
        in: query
        required: true
        schema:
          type: integer
      - description: skip n records
        name: skip
        in: query
        schema:
          type: integer
      - description: 'items to take, default: 20, max: 100000 for this special endpoint'
        name: take
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/models.PriceListPrice'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
      operationId: getV1OfflineDbSyncPricelistPrices
      x-operation-id-source: derived
  /v1/offline-db/sync/product:
    get:
      security:
      - sk: []
      - cc: []
      - jwt: []
      description: Get products that have been added or modified since the specified timestamp. Fetches only the columns that are actually needed for ODB (Offline Database).
      tags:
      - Special Endpoints
      summary: 'Get Products for Offline DB to sync, Product pictures: CDN API'
      parameters:
      - description: Last modification time (create/update)
        name: lastModified
        in: query
        required: true
        schema:
          type: integer
      - description: skip n records
        name: skip
        in: query
        schema:
          type: integer
      - description: 'items to take, default: 20, max: 8000 for this special endpoint'
        name: take
        in: query
        schema:
          type: integer
      - description: optionally return total number of records in the X-Total-Count response header
        name: withTotalCount
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          headers:
            X-Total-Count:
              description: total number of records (ignores skip & take parameters)
              schema:
                type: uint
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/models.ProductResponseForOfflineDB'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
      operationId: getV1OfflineDbSyncProduct
      x-operation-id-source: derived
  /v1/ui/product:
    get:
      security:
      - sk: []
      - cc: []
      - jwt: []
      description: 'Getting the products for the UI involves additional steps and the query is slower than the regular get products.

        NB: Filtering & sorting is not supported for the following fields: length, delivery_time, packaging_type, alcohol_registry_number, alcohol_percentage

        batches, excise_declaration_number, tax_free, is_regular_gift_card, reward_points_not_allowed, non_stock_product, cashier_must_enter_price, labels_not_needed, deposit_fee_amount'
      tags:
      - Special Endpoints
      summary: 'Get Products for UI, Product pictures: CDN API'
      parameters:
      - description: skip n records
        name: skip
        in: query
        schema:
          type: integer
      - description: 'items to take, default: 20, max: 1000'
        name: take
        in: query
        schema:
          type: integer
      - description: the sort parameter is explained in the `Filtering & Sorting` section on top of the Swagger documentation
        name: sort
        in: query
        schema:
          type: string
      - description: the filter parameter is explained in the `Filtering & Sorting` section on top of the Swagger documentation
        name: filter
        in: query
        schema:
          type: string
      - description: this is an alternative for the added field filter, the format is ISO 'yyyy-mm-dd'.
        name: createdDate
        in: query
        schema:
          type: string
      - description: optionally return total number of records in the X-Total-Count response header
        name: withTotalCount
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          headers:
            X-Total-Count:
              description: total number of records (ignores skip & take parameters)
              schema:
                type: uint
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/products.ProductResponseForUI'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MessageResponse'
      operationId: getV1UiProduct
      x-operation-id-source: derived
components:
  schemas:
    Translatable:
      type: object
      properties:
        en:
          description: This field supports more languages. Please read Translatable names and descriptions block in the documentation.
          type: string
    responses.MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: some message
    Description:
      type: object
      properties:
        en:
          description: Description supports more languages. Please read Translatable names and descriptions block in the documentation.
          $ref: '#/components/schemas/ProductDescription'
    models.ProductResponseForOfflineDB:
      type: object
      properties:
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/models.AttributeResponse'
        category_id:
