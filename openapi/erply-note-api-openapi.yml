openapi: 3.2.0
info:
  description: '## Overview


    This application offers an API for managing assignments and tasks.'
  title: assignments Note API
  contact: {}
  version: 2.36.5
tags:
- name: Note
paths:
  /api/v1/note:
    get:
      security:
      - ErplyClientCode: []
      - ErplySession: []
      - ErplyJWT: []
      - AccessToken: []
      tags:
      - Note
      summary: Look up notes
      parameters:
      - description: Note ids
        name: noteId
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - description: Workorder ids
        name: workorderId
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - description: Item ids
        name: itemId
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - description: Row ids
        name: rowId
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - description: Task ids
        name: taskId
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - description: Note types to return. Defaults to returning the `type` that correspond to the provided ID filter. Eg. when `rowId` is defined, row notes are returned etc
        name: type
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            enum:
            - workorder
            - item
            - row
            - task
            type: string
      - description: If total matching record count should be return in response header
        name: withTotalCount
        in: query
        schema:
          type: boolean
      - description: Result page size
        name: pageSize
        in: query
        schema:
          type: integer
      - description: Result page number
        name: pageNr
        in: query
        schema:
          type: integer
      - description: Sorting order
        name: sort
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NoteResponse'
        '401':
          description: Forbidden
        '500':
          description: Internal Server Error
      operationId: getApiV1Note
      x-operation-id-source: derived
    post:
      security:
      - ErplyClientCode: []
      - ErplySession: []
      - ErplyJWT: []
      - AccessToken: []
      tags:
      - Note
      summary: Add a new note record
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'
        '400':
          description: Bad Request
        '401':
          description: Forbidden
        '500':
          description: Internal Server Error
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteRequest'
        description: Note record
        required: true
      operationId: postApiV1Note
      x-operation-id-source: derived
  /api/v1/note/{noteId}:
    delete:
      security:
      - ErplyClientCode: []
      - ErplySession: []
      - ErplyJWT: []
      - AccessToken: []
      tags:
      - Note
      summary: Delete one note record
      parameters:
      - description: Note id
        name: noteId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      operationId: deleteApiV1NoteByNoteId
      x-operation-id-source: derived
    patch:
      security:
      - ErplyClientCode: []
      - ErplySession: []
      - ErplyJWT: []
      - AccessToken: []
      tags:
      - Note
      summary: Update note record
      parameters:
      - description: Note id
        name: noteId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'
        '400':
          description: Bad Request
        '401':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteRequest'
        description: Note record
        required: true
      operationId: patchApiV1NoteByNoteId
      x-operation-id-source: derived
components:
  schemas:
    NoteRequest:
      type: object
      properties:
        data:
          type: object
        id:
          type: integer
        itemId:
          type: integer
        rowId:
          type: integer
        taskId:
          type: integer
        text:
          type: string
        workorderId:
          type: integer
    NoteResponse:
      type: object
      properties:
        createdAt:
          type: string
        createdById:
          type: integer
        data:
          type: object
        id:
          type: integer
        itemId:
          type: integer
        rowId:
          type: integer
        taskId:
          type: integer
        text:
          type: string
        type:
          type: string
        updatedAt:
          type: string
        updatedById:
          type: integer
        workorderId:
          type: integer
  securitySchemes:
    AccessToken:
      type: apiKey
      name: accessToken
      in: header
    ErplyClientCode:
      type: apiKey
      name: clientCode
      in: header
    ErplyJWT:
      type: apiKey
      name: jwt
      in: header
    ErplySession:
      type: apiKey
      name: sessionKey
      in: header
    RequestKey:
      type: apiKey
      name: requestKey
      in: header
